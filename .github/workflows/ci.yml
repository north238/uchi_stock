name: CI

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  backend-tests:
    name: Backend Tests (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: htdocs
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_DATABASE: uchistock-db-testing
          MYSQL_USER: db-user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, filter, ctype, xml, session, curl, bcmath, intl, pdo, pdo_mysql, gd, redis, zip
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('htdocs/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        run: php artisan test

  frontend-checks:
    name: Frontend Checks (tsc / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: htdocs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tsc/build は vendor/tightenco/ziggy (Ziggyのroute型定義) を参照するため、
      # composerでvendorを生成してから実行する必要がある
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, filter, ctype, xml, session, curl, bcmath, intl, pdo, pdo_mysql, gd, redis, zip
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('htdocs/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: htdocs/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
